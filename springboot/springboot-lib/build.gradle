plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7' // 라이브러리 버전 관리를 위한 매니징 기능. 위에 적힌 스프링 부트 버전에 맞는 라이브러리 버전을 가져와줌
}

group = 'hello'
version = '0.0.1-SNAPSHOT'
description = 'springboot-lib'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

dependencies {
/*
    // 1. 라이브러리 직접 지정. 버전과 호환성 직접 확인 필요
    // 스프링 웹 MVC
    implementation 'org.springframework:spring-webmvc:7.0.9'
    // 내장 톰캣
    implementation 'org.apache.tomcat.embed:tomcat-embed-core:11.0.25'
    // JSON 처리
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.22.2'
    // 스프링 부트 관련
    implementation 'org.springframework.boot:spring-boot:4.1.1'
    implementation 'org.springframework.boot:spring-boot-autoconfigure:4.1.1'
    implementation 'org.springframework.boot:spring-boot-webmvc:4.1.1'
    implementation 'org.springframework.boot:spring-boot-tomcat:4.1.1'
    // log 관련
    implementation 'ch.qos.logback:logback-classic:1.6.3'
    implementation 'org.apache.logging.log4j:log4j-to-slf4j:2.26.1'
    implementation 'org.slf4j:jul-to-slf4j:2.0.18'
    // yml 관련
    implementation 'org.yaml:snakeyaml:2.6'
*/

/*
    // 2. 스프링 부트 라이브러리 버전 관리. 버전 없어도 자동으로 설정
    // 스프링 웹, MVC
    implementation 'org.springframework:spring-webmvc'
    // 내장 톰캣
    implementation 'org.apache.tomcat.embed:tomcat-embed-core'
    // JSON 처리
    implementation 'com.fasterxml.jackson.core:jackson-databind'
    // 스프링 부트 관련
    implementation 'org.springframework.boot:spring-boot'
    implementation 'org.springframework.boot:spring-boot-autoconfigure'
    implementation 'org.springframework.boot:spring-boot-webmvc'
    implementation 'org.springframework.boot:spring-boot-tomcat'
    // log 관련
    implementation 'ch.qos.logback:logback-classic'
    implementation 'org.apache.logging.log4j:log4j-to-slf4j'
    implementation 'org.slf4j:jul-to-slf4j'
    // yml 관련
    implementation 'org.yaml:snakeyaml'
*/

    // 3. 스프링 부트 스타터. 위에 하나씩 작성해준 의존성을 한 줄로 처리 가능, 의존성 세트. 스타터도 스타터를 가질 수 있다.
    implementation 'org.springframework.boot:spring-boot-starter-web'
}

// 외부 라이브러리 버전 수정하는 코드 예시
// 속성값은 스프링부트 공식 메뉴얼의 Version Properties를 참고하면 됨
// ext['tomcat.version'] = '10.1.4'

tasks.named('test') {
    useJUnitPlatform()
}
